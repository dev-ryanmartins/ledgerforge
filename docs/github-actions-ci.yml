name: LedgerForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore LedgerForge.sln
      - name: Build
        run: dotnet build LedgerForge.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test LedgerForge.sln --configuration Release --no-build --verbosity normal